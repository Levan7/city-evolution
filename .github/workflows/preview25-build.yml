name: Build City Evolution Preview 29

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refresh Ubuntu package indexes
        run: |
          sudo sed -Ei 's#https?://([^/]+\.archive\.ubuntu\.com|archive\.ubuntu\.com|security\.ubuntu\.com)/ubuntu/?#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get -o Acquire::Retries=3 -o APT::Update::Error-Mode=any update
      - name: Build and test
        run: |
          sed -i "s/-DLINCITYNG_EVOLUTION_CHECKS=ON/-DLINCITYNG_EVOLUTION_CHECKS=ON -DENABLE_NLS=OFF -DLINCITYNG_VERSION_SUFFIX=city-evolution-preview29/" contrib/build-ubuntu-2404.sh
          bash contrib/build-ubuntu-2404.sh
          export LD_LIBRARY_PATH="$HOME/lc-prefix/lib:${LD_LIBRARY_PATH:-}"
          for check in city-evolution mayor transit community services flu autonomy street-routes finance network panel-capacity save-robustness import-math crashlog airport river-industries; do
            build/linux/tests/city-evolution/"${check}-checks"
          done
          SDL_AUDIO_DRIVER=dummy build/linux/tests/city-evolution/audio-checks tests/audio-fixture working
          SDL_AUDIO_DRIVER=nonexistent build/linux/tests/city-evolution/audio-checks tests/audio-fixture missing
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export LD_LIBRARY_PATH="$HOME/lc-prefix/lib:${LD_LIBRARY_PATH:-}"
          DESTDIR="$PWD/AppDir" cmake --install build/linux --prefix /usr
          rm -f AppDir/usr/share/applications/io.github.lincity_ng.lincity-ng.desktop
          curl -fL --retry 3 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          export OUTPUT="$PWD/CityEvolution-Preview-29-x86_64.AppImage"
          app=io.github.lincity_ng.lincity-ng
          cat > city-evolution.desktop <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=City Evolution
          Exec=lincity-ng
          Icon=$app
          Categories=Game;Simulation;
          DESKTOP
          ./linuxdeploy.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/lincity-ng \
            --desktop-file city-evolution.desktop \
            --icon-file "AppDir/usr/share/icons/hicolor/256x256/apps/$app.png"
          rm -f AppDir/AppRun
          cat > AppDir/AppRun <<'SCRIPT'
          #!/bin/sh
          root="$(cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$root/usr/lib:${LD_LIBRARY_PATH:-}"
          exec "$root/usr/bin/lincity-ng" --app-data "$root/usr/share/lincity-ng" "$@"
          SCRIPT
          chmod +x AppDir/AppRun
          curl -fL --retry 3 -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage AppDir "$OUTPUT"
          test -s "$OUTPUT"
          env -u LD_LIBRARY_PATH "$OUTPUT" --version
      - uses: actions/upload-artifact@v4
        with:
          name: Preview-29-Linux-x86_64
          path: CityEvolution-Preview-29-x86_64.AppImage
          if-no-files-found: error
      - name: Compare native UI screenshots
        continue-on-error: true
        run: |
          sudo apt-get -o Acquire::Retries=3 install -y python3-pil
          export LD_LIBRARY_PATH="$HOME/lc-prefix/lib:${LD_LIBRARY_PATH:-}"
          if ! /usr/bin/python3 tests/gui_screenshots.py build/linux/bin/lincity-ng build/linux/share/lincity-ng build/ui-screenshots; then
            echo "::warning::UI screenshot check failed. See the screenshot logs and diffs in Preview-29-UI-screenshots."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: Preview-29-UI-screenshots
          path: build/ui-screenshots
          if-no-files-found: ignore

  windows:
    name: Windows x64 ZIP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile and package
        run: |
          sed -i "s/-DLINCITYNG_EVOLUTION_CHECKS=OFF/-DLINCITYNG_EVOLUTION_CHECKS=OFF -DENABLE_NLS=OFF -DLINCITYNG_VERSION_SUFFIX=city-evolution-preview29/" contrib/windows-cross/build-windows.sh
          bash contrib/windows-cross/build-windows.sh
          mv build/CityEvolution-Windows-x64.zip CityEvolution-Preview-29-Windows-x64.zip
          unzip -tq CityEvolution-Preview-29-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Preview-29-Windows-x64
          path: CityEvolution-Preview-29-Windows-x64.zip
          if-no-files-found: error
