name: Build City Evolution Preview 25 Hotfix 1

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux x86_64 AppImage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          sed -i "s/-DLINCITYNG_EVOLUTION_CHECKS=ON/-DLINCITYNG_EVOLUTION_CHECKS=ON -DENABLE_NLS=OFF -DLINCITYNG_VERSION_SUFFIX=city-evolution-preview25-hotfix1/" contrib/build-ubuntu-2404.sh
          bash contrib/build-ubuntu-2404.sh
          export LD_LIBRARY_PATH="$HOME/lc-prefix/lib:${LD_LIBRARY_PATH:-}"
          build/linux/tests/city-evolution/network-checks
      - name: Package AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          export LD_LIBRARY_PATH="$HOME/lc-prefix/lib:${LD_LIBRARY_PATH:-}"
          DESTDIR="$PWD/AppDir" cmake --install build/linux --prefix /usr
          rm -f AppDir/usr/share/applications/io.github.lincity_ng.lincity-ng.desktop
          curl -fL --retry 3 -o linuxdeploy.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          export OUTPUT="$PWD/CityEvolution-Preview-25-Hotfix-1-Linux-x86_64.AppImage"
          app=io.github.lincity_ng.lincity-ng
          cat > city-evolution.desktop <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=City Evolution
          Exec=lincity-ng
          Icon=$app
          Categories=Game;Simulation;
          DESKTOP
          ./linuxdeploy.AppImage --appdir AppDir \
            --executable AppDir/usr/bin/lincity-ng \
            --desktop-file city-evolution.desktop \
            --icon-file "AppDir/usr/share/icons/hicolor/256x256/apps/$app.png"
          rm -f AppDir/AppRun
          cat > AppDir/AppRun <<'SCRIPT'
          #!/bin/sh
          root="$(cd -- "$(dirname -- "$0")" && pwd)"
          export LD_LIBRARY_PATH="$root/usr/lib:${LD_LIBRARY_PATH:-}"
          exec "$root/usr/bin/lincity-ng" --app-data "$root/usr/share/lincity-ng" "$@"
          SCRIPT
          chmod +x AppDir/AppRun
          curl -fL --retry 3 -o appimagetool.AppImage https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool.AppImage
          ARCH=x86_64 ./appimagetool.AppImage AppDir "$OUTPUT"
          test -s "$OUTPUT"
          env -u LD_LIBRARY_PATH "$OUTPUT" --version
      - uses: actions/upload-artifact@v4
        with:
          name: Preview-25-Hotfix-1-Linux-x86_64
          path: CityEvolution-Preview-25-Hotfix-1-Linux-x86_64.AppImage
          if-no-files-found: error

  windows:
    name: Windows x64 ZIP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cross-compile and package
        run: |
          sed -i "s/-DLINCITYNG_EVOLUTION_CHECKS=OFF/-DLINCITYNG_EVOLUTION_CHECKS=OFF -DENABLE_NLS=OFF -DLINCITYNG_VERSION_SUFFIX=city-evolution-preview25-hotfix1/" contrib/windows-cross/build-windows.sh
          bash contrib/windows-cross/build-windows.sh
          mv build/CityEvolution-Windows-x64.zip CityEvolution-Preview-25-Hotfix-1-Windows-x64.zip
          unzip -tq CityEvolution-Preview-25-Hotfix-1-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Preview-25-Hotfix-1-Windows-x64
          path: CityEvolution-Preview-25-Hotfix-1-Windows-x64.zip
          if-no-files-found: error
